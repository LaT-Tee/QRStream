name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: 检查标签与 package.json 版本一致
        run: |
          v=$(node -p "require('./package.json').version")
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "标签 $GITHUB_REF_NAME 与 package.json 版本 $v 不一致"; exit 1; }
      - run: npm ci
      - run: npm run build
        env:
          # 写入油猴 @updateURL / @downloadURL，指向最新 Release 的附件
          USERSCRIPT_URL: https://github.com/${{ github.repository }}/releases/latest/download/qrstream-sender.user.js
      - run: npm test
      - name: 打包网页版
        run: cd dist/web && zip -r "../qrstream-web-${GITHUB_REF_NAME}.zip" .
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/qrstream-sender.user.js
            dist/qrstream-web-${{ github.ref_name }}.zip
