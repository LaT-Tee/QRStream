<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>QRStream</title>
<meta name="description" content="离线屏幕传输：彩格码 / 二维码 + 喷泉码，发送/接收二合一">
<meta name="theme-color" content="#e8ebee" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d0f12" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<meta name="app-version" content="/*@VERSION*/">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="QRStream">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<style>
/* 版面：取景框与白色播放屏是两个物件，其余界面退到纸面上；颜色只来自数据（码的色板、子像素 R/G/B、块状态）。
 * 唯一的大胆处：点阵字（Doto）写的接收读数，和块拼图同源。左对齐，不切卡片，标签能省则省。
 *   手机接收：[取景框 通栏] → [点阵读数 + 一句话状态] → [块拼图] → [开始/停止]
 *   发送：[纸面：文本框 · 选文件 · 码型 · 压缩] [开始播放]　｜　[白色屏幕 + 裁切标记] [第 N 张  暂停 全屏] [一句话说明]
 */
@font-face{font-family:"Doto";font-weight:900;font-display:block;src:url(data:font/woff2;base64,/*@FONT_DOTO*/) format("woff2")}
:root{
  --paper:#eceef0; --sheet:#f8f9fa; --ink:#000; --ink2:#565d66; --ink3:#8b929b; --rule:#cdd2d8; --screen:#fff;
  --r:#e5484d; --g:#1fa774; --b:#3e63dd; --idle:#d6dae0; --warn:#b26b00; --bad:#d4373c;
  --dot:"Doto",ui-monospace,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","HarmonyOS Sans SC","MiSans","Noto Sans CJK SC","Microsoft YaHei UI","Microsoft YaHei",sans-serif;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px); --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --paper:#000; --sheet:#121315; --ink:#f2f4f6; --ink2:#a0a7b0; --ink3:#6c737c; --rule:#26292d; --screen:#fff;
  --r:#ff6369; --g:#3dd68c; --b:#7b9bff; --idle:#2a2e33; --warn:#ffb224; --bad:#ff6369; color-scheme:dark } }
:root[data-theme="dark"]{
  --paper:#000; --sheet:#121315; --ink:#f2f4f6; --ink2:#a0a7b0; --ink3:#6c737c; --rule:#26292d; --screen:#fff;
  --r:#ff6369; --g:#3dd68c; --b:#7b9bff; --idle:#2a2e33; --warn:#ffb224; --bad:#ff6369; color-scheme:dark }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--paper)}
body{margin:0;min-height:100dvh;background:var(--paper);color:var(--ink);font:15px/1.6 var(--sans);-webkit-font-smoothing:antialiased;
  -webkit-text-size-adjust:100%;overscroll-behavior-y:none}
button,input,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* 顶栏 */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;
  padding:calc(var(--sat) + 12px) calc(var(--sar) + 20px) 12px calc(var(--sal) + 20px);
  background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.brand{display:flex;align-items:center;gap:10px;font:900 21px/1 var(--dot);letter-spacing:.02em}
.mark{position:relative;width:20px;height:20px;border:3px solid var(--ink)}
.mark::after{content:"";position:absolute;inset:3px;background:var(--ink)}
.net{margin-left:auto;display:inline-flex;align-items:center;gap:8px;border:0;background:none;padding:6px 2px;font-size:13px;color:var(--ink2);cursor:pointer}
.net i{width:8px;height:8px;border-radius:50%;background:var(--warn)}
.net.ok i{background:var(--g)}
.tabs{position:fixed;z-index:30;left:50%;transform:translateX(-50%);display:flex;padding:4px;border-radius:999px;background:var(--sheet);border:1px solid var(--rule)}
.tabs button{display:flex;align-items:center;gap:8px;padding:9px 22px;border:0;border-radius:999px;background:none;color:var(--ink2);font-size:15px;font-weight:600;cursor:pointer}
.tabs button.on{background:var(--ink);color:var(--paper)}
@media (max-width:899px){ .tabs{bottom:calc(var(--sab) + 14px);box-shadow:0 6px 24px rgba(0,0,0,.16)} .tabs button{padding:12px 28px} }
@media (min-width:900px){ .tabs{top:calc(var(--sat) + 9px)} }
main{max-width:1180px;margin:0 auto;padding:8px calc(var(--sar) + 20px) calc(var(--sab) + 110px) calc(var(--sal) + 20px)}
@media (min-width:900px){ main{padding:24px 32px 56px} }

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 22px;border-radius:999px;border:1.5px solid var(--ink);
  background:transparent;color:var(--ink);font-weight:600;font-size:15px;cursor:pointer;white-space:nowrap;text-decoration:none;transition:transform .08s,opacity .15s}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.3;pointer-events:none}
.btn.solid{background:var(--ink);color:var(--paper)}
.btn.round{width:48px;padding:0}
.btn.big{min-height:56px;font-size:16px}

/* 接收 */
.recv-layout{display:grid;gap:22px;grid-template-columns:minmax(0,1fr);align-items:start}
@media (min-width:900px){ .recv-layout{grid-template-columns:minmax(0,1.15fr) minmax(320px,.85fr);gap:48px} .readout{position:sticky;top:96px} }
.scanner{background:#000;margin:0 calc(-20px - var(--sar)) 0 calc(-20px - var(--sal))}
@media (min-width:900px){ .scanner{margin:0;border-radius:8px;overflow:hidden;box-shadow:0 0 0 1px var(--rule)} }
#wrap{position:relative;aspect-ratio:1/1;width:min(100%,70dvh,660px);max-width:100%;margin:0 auto;background:#000;overflow:hidden}
@media (max-width:899px){ #wrap{width:min(100%,max(260px,calc(100dvh - 360px)))} }
video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.frame{position:absolute;inset:8%;pointer-events:none}
.frame::before,.frame::after,.frame>i::before,.frame>i::after{content:"";position:absolute;width:26px;height:26px;border:2px solid #fff}
.frame::before{left:0;top:0;border-right:0;border-bottom:0}
.frame::after{right:0;top:0;border-left:0;border-bottom:0}
.frame>i::before{left:0;bottom:0;border-right:0;border-top:0}
.frame>i::after{right:0;bottom:0;border-left:0;border-top:0}
#camIdle{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;border:0;padding:24px;
  background:transparent;color:#fff;cursor:pointer;text-align:center}
#camIdle strong{font-size:19px;font-weight:650}
#camIdle span{font-size:13px;color:rgba(255,255,255,.62)}
.readout{display:grid;gap:18px;min-width:0}
.pct{display:grid;gap:12px;min-width:0}
#bigPct{font:900 88px/.85 var(--dot);padding-right:.15em}
#status{font-size:15px;color:var(--ink2);min-width:0;word-break:break-word;text-wrap:pretty}
#status.done{color:var(--ink);font-weight:600}
#gcv{display:block;width:100%;max-height:230px;object-fit:contain;object-position:left top;image-rendering:pixelated}
.key{display:flex;gap:18px;flex-wrap:wrap;font-size:13px;color:var(--ink2);margin-top:-6px}
.key i{display:inline-block;width:9px;height:9px;margin-right:7px;vertical-align:0}
#missing,#perf{font-size:13px;color:var(--ink3)}
#missing:empty,#perf:empty,#log:empty{display:none}
#log{font-size:12px;color:var(--ink3);word-break:break-all}
.ctl{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ctl .grow{flex:1}
#zoomBox{flex-basis:100%;display:flex;align-items:center;gap:10px;font-size:13px;color:var(--ink2)}
#zoomBox input{flex:1;accent-color:var(--ink)}
#resultCard{background:var(--sheet);border:1px solid var(--rule);border-radius:14px;padding:18px}
#resultCard h2{margin:0 0 12px;font-size:15px;font-weight:650}
#result .acts{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
#result .acts .btn{min-height:42px}
#result textarea{width:100%;min-height:32dvh;resize:vertical;padding:14px;border-radius:10px;border:1px solid var(--rule);background:var(--paper);color:var(--ink);font:14px/1.6 var(--sans);outline:none}
/* iPhone：结果区除文本框外都不可选中，长按图片直接出「存储到照片」，不会先选中文字 */
#result{-webkit-user-select:none;user-select:none}
#result textarea{-webkit-user-select:text;user-select:text}
#result img{display:block;max-width:100%;border-radius:8px;background:#fff;-webkit-touch-callout:default}
.fileinfo{display:flex;align-items:center;gap:12px}
.fileinfo .ext{width:44px;height:44px;display:grid;place-items:center;background:var(--ink);color:var(--paper);font:900 13px var(--dot)}

/* 发送 */
.send-layout{display:grid;gap:22px;grid-template-columns:minmax(0,1fr);align-items:start}
@media (min-width:900px){ .send-layout{grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr);gap:48px} .stagecol{position:sticky;top:96px} }
.compose{display:grid;gap:14px;min-width:0}
.sheet{background:var(--sheet);border:1px solid var(--rule);border-radius:14px;transition:border-color .15s,box-shadow .15s}
.sheet.over{border-color:var(--ink);box-shadow:0 0 0 3px color-mix(in srgb,var(--ink) 14%,transparent)}
#sText{display:block;width:100%;min-height:180px;resize:vertical;padding:18px 18px 12px;border:0;background:transparent;outline:none;font:15px/1.65 var(--sans)}
#sText::placeholder{color:var(--ink3)}
.filerow{display:flex;align-items:center;gap:10px;padding:10px 18px 16px}
.pick{position:relative;display:inline-flex;align-items:center;gap:7px;font-size:14px;font-weight:600;cursor:pointer;color:var(--ink);text-decoration:underline;text-underline-offset:3px}
.pick input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.pick:focus-within{outline:2px solid var(--ink);outline-offset:3px}
#sFileName{flex:1;min-width:0;font-size:13px;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#sClear{border:0;background:none;color:var(--ink3);font-size:13px;cursor:pointer}
.opts{border-top:1px solid var(--rule);padding:16px 18px 18px;display:grid;gap:16px}
.kinds{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.kinds label{position:relative;display:grid;gap:8px;padding:13px 14px;border:1.5px solid var(--rule);border-radius:10px;cursor:pointer;background:var(--paper)}
.kinds input{position:absolute;opacity:0;pointer-events:none}
.kinds b{font-size:15px;font-weight:650}
.kinds small{font-size:13px;color:var(--ink2);line-height:1.45}
.kinds label:has(input:checked){border-color:var(--ink)}
.kinds label:has(input:checked)::after{content:"";position:absolute;right:12px;top:14px;width:9px;height:9px;background:var(--ink)}
.kinds label:has(input:focus-visible){outline:2px solid var(--ink);outline-offset:2px}
.pal{display:flex;flex-wrap:wrap;gap:2px}
.pal i{width:8px;height:8px;box-shadow:inset 0 0 0 1px var(--rule)}
.switch{display:flex;align-items:center;gap:14px;cursor:pointer;user-select:none}
.switch span{flex:1;font-size:15px}
.switch small{display:block;font-size:13px;color:var(--ink2)}
input.sw{appearance:none;-webkit-appearance:none;flex:none;width:46px;height:28px;margin:0;border-radius:999px;background:var(--idle);position:relative;cursor:pointer;transition:background .2s}
input.sw::before{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--sheet);box-shadow:0 1px 2px rgba(0,0,0,.3);transition:transform .2s}
input.sw:checked{background:var(--ink)}
input.sw:checked::before{transform:translateX(18px)}
#sErr{color:var(--bad);font-size:14px}
#sErr:empty{display:none}

/* 白色屏幕：四角裁切标记 */
#stage{position:relative;background:var(--screen);border-radius:6px;padding:28px;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:320px;
  box-shadow:0 0 0 1px var(--rule)}
#stage::before,#stage::after,#stage>.cm::before,#stage>.cm::after{content:"";position:absolute;width:14px;height:14px;border:1.5px solid #9aa1aa}
#stage::before{left:10px;top:10px;border-right:0;border-bottom:0}
#stage::after{right:10px;top:10px;border-left:0;border-bottom:0}
#stage>.cm::before{left:10px;bottom:10px;border-right:0;border-top:0}
#stage>.cm::after{right:10px;bottom:10px;border-left:0;border-top:0}
#stageBox{width:100%;display:flex;justify-content:center}
#sCv{display:block;max-width:100%;image-rendering:pixelated;image-rendering:crisp-edges}
#stageEmpty{color:#6c737c;text-align:center;font-size:15px;max-width:22em}
#fsTools{display:none}
#stage.full{position:fixed;inset:0;z-index:100;border-radius:0;min-height:0;box-shadow:none;
  padding:calc(var(--sat) + 16px) calc(var(--sar) + 16px) calc(var(--sab) + 80px) calc(var(--sal) + 16px)}
#stage.full #fsTools{display:flex;gap:4px;position:absolute;left:50%;transform:translateX(-50%);bottom:calc(var(--sab) + 18px);padding:4px;border-radius:999px;background:#000}
#stage.full #fsTools .btn{min-height:42px;border:0;color:#fff;font-size:14px}
.playbar{display:flex;align-items:center;gap:10px;margin-top:14px}
#sIdx{flex:1;font-size:14px;color:var(--ink2)}
.playbar .btn{min-height:42px;padding:0 18px}
#sInfo{margin:14px 0 0;font-size:15px;color:var(--ink);max-width:36em}
#sInfo small{display:block;margin-top:4px;font-size:13px;color:var(--ink3)}
#sInfo:empty{display:none}
@media (prefers-reduced-motion:reduce){ *{transition:none!important} }
</style>
</head>
<body>
<header class="top">
  <div class="brand"><span class="mark"></span>QRStream</div>
  <button class="net" id="net" title="离线状态"></button>
</header>
<nav class="tabs" aria-label="页签">
  <button id="tabRecv" class="on">接收</button>
  <button id="tabSend">发送</button>
</nav>

<main>
<!-- ================= 接收 ================= -->
<section id="recv" class="recv-layout">
  <div class="scanner">
    <div id="wrap">
      <video id="video" playsinline muted></video>
      <div class="frame" id="roi"><i></i></div>
      <button id="camIdle" type="button"><strong>点按开始扫描</strong><span>让发送端的码占满四个角标</span></button>
    </div>
  </div>

  <div class="readout">
    <div class="pct"><span id="bigPct" aria-label="接收进度">0%</span><div id="status">未开始</div></div>
    <canvas id="gcv" width="1" height="1" aria-label="每个块的接收情况" hidden></canvas>
    <div class="key" id="key" hidden><span><i style="background:var(--g)"></i>直接收到</span><span><i style="background:var(--b)"></i>冗余补出</span><span><i style="background:var(--idle)"></i>还没收到</span></div>
    <div id="missing"></div>
    <div class="ctl">
      <button class="btn solid big grow" id="start">开始扫描</button>
      <button class="btn big grow" id="stopBtn" hidden>停止</button>
      <button class="btn round big" id="reset" title="清空进度" aria-label="清空进度"><svg class="i" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg></button>
      <label id="zoomBox" hidden>变焦 <input type="range" id="zoom" min="1" max="1" step="0.1" value="1"></label>
    </div>
    <div id="perf"></div>
    <div id="resultCard" hidden><h2>收到的内容</h2><div id="result"></div></div>
    <div id="log"></div>
  </div>
  <canvas id="cv" hidden></canvas>
</section>

<!-- ================= 发送 ================= -->
<section id="send" class="send-layout" hidden>
  <div class="compose">
    <div class="sheet" id="drop">
      <label class="sr" for="sText">要发送的内容</label>
      <textarea id="sText" placeholder="输入或粘贴要发送的文字。截图可以直接粘贴，文件可以拖进来。"></textarea>
      <div class="filerow">
        <label class="pick">选择文件<input type="file" id="sFile"></label>
        <span id="sFileName"></span><button id="sClear" hidden>移除</button>
      </div>
      <div class="opts">
        <div class="kinds" role="radiogroup" aria-label="码型">
          <label><input type="radio" name="kind" id="kGrid" value="grid" checked><b>彩格码</b><span class="pal" id="palGrid"></span><small>最快。用本应用接收</small></label>
          <label><input type="radio" name="kind" id="kQr" value="qr"><b>二维码</b><span class="pal" id="palQr"></span><small>旧版和油猴接收端也能读</small></label>
        </div>
        <label class="switch"><span>压缩<small>无损，自动选 LZMA（7z 同款算法）或 deflate 里更小的</small></span><input type="checkbox" class="sw" id="sZ" checked></label>
      </div>
    </div>
    <button class="btn solid big" id="sGen">开始播放</button>
    <div id="sErr"></div>
  </div>

  <div class="stagecol">
    <div id="stage">
      <span class="cm"></span>
      <div id="stageEmpty">写好内容后点「开始播放」，码会在这里循环播放。手机打开本应用的接收页对准它就行。</div>
      <div id="stageBox" hidden><canvas id="sCv" width="300" height="300"></canvas></div>
      <div id="fsTools"><button class="btn" id="fsPlay">暂停</button><button class="btn" id="fsExit">退出全屏</button></div>
    </div>
    <div class="playbar"><span id="sIdx"></span>
      <button class="btn" id="sPlay" disabled>暂停</button>
      <button class="btn solid" id="sFull" disabled>全屏播放</button>
    </div>
    <div id="sInfo"></div>
  </div>
</section>
</main>

<!-- ================= 内联资源（构建时填充） ================= -->
<script type="text/plain" id="res-zxjs">/*@ZXING_JS*/</script>
<script type="text/plain" id="res-wasm">/*@ZXING_WASM_B64*/</script>
<script type="text/plain" id="res-jsqr">/*@JSQR_B64*/</script>
<script type="text/plain" id="src-scan">/*@SCAN_WORKER*/</script>
<script type="text/plain" id="src-dec">/*@DECODE_WORKER*/</script>
<script>/*@QRCODE_LIB*/</script>
<script>/*@CODEC*/</script>
<script>/*@GRID_CODE*/</script>
<script>/*@LZMA*/</script>
<script>/*@SENDER_CORE*/</script>
<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const store = { get(k, d) { try { const v = localStorage.getItem('qrs1.' + k); return v == null ? d : v; } catch { return d; } },
                set(k, v) { try { localStorage.setItem('qrs1.' + k, v); } catch {} } };

/* 固定参数（仿真选出的最优值，见 docs/SIMULATION.md）：不再让用户调 */
const INTERVAL_MS = 66;                                                      // 60Hz 下 4 次刷新；30fps 摄像头每张都能完整拍到一次
const GRID = { long: 85, levels: [2, 4, 2], rate: 5, tile: 24 };             // 彩格码：85 格、16 色、LDPC 码率 3/4
const QR = { chunk: 500, ecc: 'L', rgb: true };                              // 二维码：RGB 三通道，每帧 500 字节，纠错 L
const SCAN_OUT = 640;                                                        // 二维码识别时取景框缩到的边长

/* ================= 页签 / 离线状态 ================= */
function showTab(t) {
  $('recv').hidden = t !== 'recv'; $('send').hidden = t !== 'send';
  $('tabRecv').classList.toggle('on', t === 'recv'); $('tabSend').classList.toggle('on', t === 'send');
  store.set('tab', t);
  if (t === 'send') { if (running) { stopScan(); setStatus('已停止（切到发送页）'); } fitSender(); }
  else { player.stop(); syncPlayBtn(); }
  scrollTo({ top: 0 });
}
$('tabRecv').onclick = () => showTab('recv');
$('tabSend').onclick = () => showTab('send');
const isFile = location.protocol === 'file:';  // 双击打开的本地文件：本身就是离线的，不需要 Service Worker
let offlineReady = isFile;
const netUI = () => {
  const n = $('net'), sw = 'serviceWorker' in navigator;
  n.innerHTML = '<i></i>' + (isFile ? '本地文件' : !sw ? '在线' : offlineReady ? '离线可用' : '缓存中…');
  n.classList.toggle('ok', offlineReady);
};
addEventListener('online', netUI); addEventListener('offline', netUI);
$('net').onclick = () => alert(isFile
  ? '正在以本地文件方式运行，所有代码已内联在 index.html 中，断网也能用。'
  : offlineReady
  ? '已缓存到本机，断网/飞行模式下也能打开。\n（iPhone：从主屏幕图标打开的 App 和 Safari 是分开缓存的，两边各需要在线打开一次）'
  : '还没缓存完成：请保持联网，停留在本页几秒，直到右上角变成「离线可用」。');
if ('serviceWorker' in navigator && !isFile) {
  navigator.serviceWorker.addEventListener('message', e => { if (e.data && 'offlineReady' in e.data) { offlineReady = !!e.data.offlineReady; netUI(); } });
  navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).catch(() => {});
  navigator.serviceWorker.ready.then(reg => reg.active && reg.active.postMessage('ping'));
}
netUI();

let wakeLock = null;
async function keepAwake(on) {
  try {
    if (on && !wakeLock && navigator.wakeLock) { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.onrelease = () => { wakeLock = null; }; }
    if (!on && wakeLock) { await wakeLock.release(); wakeLock = null; }
  } catch {}
}

/* ================= 内联资源解压 ================= */
async function inflateB64(id) {
  const b = atob($(id).textContent.trim()), u8 = new Uint8Array(b.length);
  for (let i = 0; i < b.length; i++) u8[i] = b.charCodeAt(i);
  return new Response(new Blob([u8]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer();
}
const blobWorker = id => new Worker(URL.createObjectURL(new Blob([$(id).textContent], { type: 'text/javascript' })));

/* ================= 接收端 ================= */
const video = $('video'), cv = $('cv'), ctx = cv.getContext('2d', { willReadFrequently: true });
let scanW = null, decW = null, engine = '', stream = null, running = false, busy = false, fresh = false, lastRaw = '';
let S = null;   // 主线程只保存显示用的会话信息
function setStatus(s, done) { $('status').textContent = s; $('status').classList.toggle('done', !!done); }
function setPct(p) { $('bigPct').textContent = Math.floor(p) + '%'; }
function log(s) { $('log').textContent = s; }
function syncScanUI() {
  $('start').hidden = running; $('stopBtn').hidden = !running;
  $('camIdle').hidden = running;
}

function getWorkers() {
  if (scanW) return;
  scanW = blobWorker('src-scan');
  scanW.onmessage = onScan;
  scanW.onerror = e => log('识别线程错误：' + (e.message || e));
  decW = blobWorker('src-dec');
  decW.onmessage = onDec;
  decW.onerror = e => log('解码线程错误：' + (e.message || e));
  (async () => {
    const init = { zxingJs: $('res-zxjs').textContent, wasm: null, jsqrJs: null };
    try { init.wasm = await inflateB64('res-wasm'); } catch (e) { log('WASM 解压失败，改用 jsQR：' + e.message); }
    try { init.jsqrJs = new TextDecoder().decode(await inflateB64('res-jsqr')); } catch (e) {}
    scanW.postMessage({ init }, init.wasm ? [init.wasm] : []);
  })();
}

// 进度格子：每格一个源块。冗余帧大多在收齐（rank=K）那一刻一起解出，所以「冗余补出」主要在完成时出现
const GCOLS = 50, tok = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
let C_IDLE = '#d3d8de', C_SRC = '#1fa774', C_REC = '#3e63dd';
let cells = null;   // 每格：0 未确定 / 1 直接收到 / 2 冗余补出
function drawCell(i, color) { const c = $('gcv').getContext('2d'); c.fillStyle = color; c.fillRect((i % GCOLS) * 7, Math.floor(i / GCOLS) * 7, 6, 6); }
function setCell(i, how) { if (!cells || cells[i]) return; cells[i] = how; drawCell(i, how === 1 ? C_SRC : C_REC); }
function initGrid(K) {
  C_IDLE = tok('--idle') || C_IDLE; C_SRC = tok('--ok') || C_SRC; C_REC = tok('--rec') || C_REC;
  const g = $('gcv'); g.width = GCOLS * 7 - 1; g.height = Math.ceil(K / GCOLS) * 7 - 1; g.hidden = false; $('key').hidden = false;
  cells = new Uint8Array(K);
  for (let i = 0; i < K; i++) drawCell(i, C_IDLE);
}
function setResultVisible(v) { $('resultCard').hidden = !v; }

function resetSession() {
  S = null; ui = null; cells = null; lastRaw = ''; $('missing').textContent = ''; $('result').innerHTML = ''; setResultVisible(false);
  const g = $('gcv'); g.width = 1; g.height = 1; g.hidden = true; $('key').hidden = true;
  setPct(0);
  getWorkers(); decW.postMessage({ cmd: 'reset' }); scanW.postMessage({ reset: true });
  setStatus(running ? '正在找码…' : '未开始');
}

let ui = null, uiPending = false;
function scheduleUI() {
  if (uiPending) return; uiPending = true;
  requestAnimationFrame(() => {
    uiPending = false; if (!S || S.done || !ui) return;
    const pct = ui.rank / S.K * 100, need = S.K - ui.rank;
    setPct(pct);
    setStatus(`已收 ${ui.rank} / ${S.K} 块，还差约 ${need + 2} 块。保持对准即可。`);
   
    const pending = ui.rank - ui.known;
    $('missing').textContent = pending > 0 ? `灰色里有 ${pending} 块已被冗余数据抵上，收齐时一起解出。` : '';
  });
}

function onDec(e) {
  const m = e.data;
  switch (m.type) {
    case 'session':
      S = { sid: m.sid, K: m.K, len: m.len, done: false, t0: performance.now() };
      $('result').innerHTML = ''; setResultVisible(false); initGrid(m.K); setPct(0);
      log(`会话 ${m.sid}，${m.v === 5 ? '彩格码' : m.v === 3 ? '二维码（v3 旧协议）' : '二维码'}，${m.K} 块，每块 ${m.C} 字节`);
      setStatus(`找到了，共 ${m.K} 块。`);
      break;
    case 'progress':
      ui = m;
      for (const [c, how] of m.newly) setCell(c, how === 's' ? 1 : 2);
      scheduleUI();
      break;
    case 'solving':
      setStatus(`已收齐，正在还原（${(m.pct * 100).toFixed(0)}%）。`); setPct(100);
      break;
    case 'done':
      if (S) S.done = true;
      stopScan();
      if (cells) for (let i = 0; i < m.K; i++) setCell(i, 2);   // 剩下的块都是收齐后由冗余数据消元解出的
      $('missing').textContent = ''; setPct(100);
      {
        const secs = Math.max(0.1, m.secs), zip = m.meta.z ? `，压缩后实际传了 ${fmtB(m.plen)}（${m.meta.z === 'lzma' ? 'LZMA' : 'deflate'}）` : '';
        setStatus(`✅ 收好了：${m.meta.t === 'text' ? '一段文字' : m.meta.name}，${fmtB(m.meta.len)}。用时 ${secs.toFixed(1)} 秒，平均 ${fmtB(m.meta.len / secs)}/秒${zip}。`, true);
        log(`${S && S.note ? S.note + '；' : ''}收了 ${m.received} 块，最少要 ${m.K} 块。`);
      }
      if (navigator.vibrate) navigator.vibrate([80, 50, 80]);
      showResult(m.meta, new Uint8Array(m.data));
      break;
    case 'fail': if (S) S.done = true; stopScan(); setStatus('❌ ' + m.msg); break;
    case 'log': log(m.msg); if (S && /恢复/.test(m.msg)) S.note = m.msg; break;
    case 'foreign': log('不是本应用的码：' + m.text); break;
    case 'reset': log('已清空（含本机保存的续传进度）'); break;
  }
}
const fmtB = n => n < 1024 ? n + ' B' : n < 1048576 ? (n / 1024).toFixed(1) + ' KB' : (n / 1048576).toFixed(2) + ' MB';
const mkBtn = (html, cls = 'btn') => { const b = document.createElement('button'); b.className = cls; b.innerHTML = html; return b; };

function showResult(meta, data) {
  const r = $('result'); r.innerHTML = ''; setResultVisible(true);
  const blob = new Blob([data], { type: meta.mime }), url = URL.createObjectURL(blob);
  const acts = document.createElement('div'); acts.className = 'acts';
  const dl = document.createElement('a'); dl.href = url; dl.download = meta.name; dl.className = 'btn'; dl.textContent = '下载';
  acts.appendChild(dl);
  const file = new File([blob], meta.name, { type: meta.mime });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    const sh = mkBtn('分享 / 存到文件');
    sh.onclick = () => navigator.share({ files: [file], title: meta.name }).catch(() => {});
    acts.appendChild(sh);
  }
  r.appendChild(acts);
  if (meta.t === 'text') {
    const ta = document.createElement('textarea'); ta.value = new TextDecoder().decode(data);
    const cp = mkBtn('复制文本', 'btn primary');
    cp.onclick = async () => { try { await navigator.clipboard.writeText(ta.value); } catch { ta.select(); document.execCommand('copy'); } cp.textContent = '已复制 ✓'; };
    acts.prepend(cp); r.appendChild(ta);
  } else if (meta.mime.startsWith('image/')) {
    const img = document.createElement('img'); img.src = url; r.appendChild(img);
    const tip = document.createElement('div'); tip.className = 'tiny'; tip.style.marginTop = '10px';
    tip.textContent = 'iPhone：长按图片 →「存储到照片」，或点「分享」→「存储图像」。'; r.appendChild(tip);
  } else {
    const fi = document.createElement('div'); fi.className = 'fileinfo';
    const ext = (meta.name.split('.').pop() || 'bin').slice(0, 4).toUpperCase();
    fi.innerHTML = `<span class="ext"></span><div><div style="font-weight:600"></div><div class="tiny"></div></div>`;
    fi.querySelector('.ext').textContent = ext;
    fi.querySelector('div>div').textContent = meta.name;
    fi.querySelector('.tiny').textContent = `${fmtB(meta.len)} · ${meta.mime}`;
    r.appendChild(fi);
  }
  if (innerWidth < 900) $('resultCard').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

/* ---------- 摄像头：后置、1080p（每格像素多，离远一点也能读；见仿真报告） ---------- */
async function startScan() {
  if (!window.isSecureContext) { setStatus('❌ 必须用 HTTPS（或 localhost）打开本页才能使用摄像头'); return; }
  stopScan();
  getWorkers();
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: false, video: {
      facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 }, frameRate: { ideal: 30, max: 30 } } });
  } catch (e) { setStatus('❌ 无法打开摄像头：' + e.message); return; }
  video.srcObject = stream; await video.play();
  const track = stream.getVideoTracks()[0];
  try { await track.applyConstraints({ advanced: [{ focusMode: 'continuous' }] }); } catch {}
  try {
    const cap = track.getCapabilities ? track.getCapabilities() : {};
    if (cap.zoom && cap.zoom.max > cap.zoom.min) {
      Object.assign($('zoom'), { min: cap.zoom.min, max: Math.min(cap.zoom.max, 8), step: cap.zoom.step || 0.1, value: track.getSettings().zoom || cap.zoom.min });
      $('zoomBox').hidden = false;
    }
  } catch {}
  running = true; fresh = true; keepAwake(true); syncScanUI();
  if (!S || S.done) setStatus(engine ? '正在找码…' : '正在加载识别引擎…');
  nextVideoFrame();
}
function stopScan() {
  running = false; keepAwake(false);
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
  video.srcObject = null; $('zoomBox').hidden = true; syncScanUI();
}
$('zoom').oninput = () => { try { stream && stream.getVideoTracks()[0].applyConstraints({ advanced: [{ zoom: +$('zoom').value }] }); } catch {} };

function nextVideoFrame() {
  if (!running) return;
  if (video.requestVideoFrameCallback) video.requestVideoFrameCallback(onVideoFrame);
  else requestAnimationFrame(onVideoFrame);
}
function onVideoFrame() { fresh = true; pump(); nextVideoFrame(); }

// 整幅画面送去识别：彩格码用整幅；二维码在识别线程里取中央正方形（= 取景框）
function pump() {
  if (!running || busy || !fresh || !engine || document.hidden || video.readyState < 2) return;
  fresh = false;
  const vw = video.videoWidth, vh = video.videoHeight, k = Math.min(1, 1920 / Math.max(vw, vh)), w = Math.round(vw * k), h = Math.round(vh * k);
  if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; }
  ctx.drawImage(video, 0, 0, w, h);
  const img = ctx.getImageData(0, 0, w, h);
  busy = true; perf.n++;
  scanW.postMessage({ buf: img.data.buffer, w, h, mode: 'auto', out: SCAN_OUT }, [img.data.buffer]);
}
const perf = { n: 0, ok: 0, ms: 0, gOk: 0, gOf: 0, t: performance.now() };
function onScan(e) {
  const d = e.data;
  if (d.ready) {
    engine = d.ready; document.body.dataset.engine = engine;
    if (running && (!S || S.done)) setStatus('正在找码…');
    pump(); return;
  }
  busy = false; perf.ms += d.ms;
  if (d.texts.length) {
    perf.ok += d.texts.length;
    const nt = d.texts.filter(t => t !== lastRaw);
    if (nt.length) { lastRaw = nt[nt.length - 1]; decW.postMessage({ texts: nt }); }
  }
  if (d.grid) { perf.gOk += d.grid.ok; perf.gOf += d.grid.of; if (d.frames.length) decW.postMessage({ frames: d.frames }); }
  const now = performance.now();
  if (now - perf.t > 1000) {
    const s = (now - perf.t) / 1000, gr = perf.gOf ? perf.gOk / perf.gOf : 0;
    const tip = perf.gOf && gr < 0.6 ? '识别率偏低，靠近一些、拿稳、避开反光。' : '';
    $('perf').textContent = !running ? '' : perf.gOf
      ? `每秒看 ${(perf.n / s).toFixed(0)} 帧，块识别率 ${(gr * 100).toFixed(0)}%。${tip}`
      : `每秒看 ${(perf.n / s).toFixed(0)} 帧，识别出 ${(perf.ok / s).toFixed(1)} 个二维码（${engine}）。`;
    perf.n = perf.ok = perf.ms = perf.gOk = perf.gOf = 0; perf.t = now;
  }
  pump();
}

document.addEventListener('visibilitychange', () => { if (!document.hidden) { pump(); if (running) keepAwake(true); } });
let rzT = 0; addEventListener('resize', () => { clearTimeout(rzT); rzT = setTimeout(fitSender, 80); });
$('start').onclick = startScan;
$('camIdle').onclick = startScan;
$('stopBtn').onclick = () => { stopScan(); $('perf').textContent = ''; setStatus('已停止' + (S && ui && !S.done ? `（已收 ${ui.rank}/${S.K}，进度已保存在本机，可继续）` : '')); };
$('reset').onclick = resetSession;

/* ================= 发送端 ================= */
const QXS = window.QXS, QXG = window.QXG;
let sFile = null, sess = null, sGrid = null;   // sGrid：彩格码 GridFramer（二维码模式为 null）
const player = new QXS.Player($('sCv'), {
  box: () => senderBox(),
  dpr: () => window.devicePixelRatio || 1,
  interval: () => INTERVAL_MS,
  onShow: label => { $('sIdx').textContent = label; },
});
/** 码可用的显示区域（CSS 像素） */
function senderBox() {
  const st = $('stage'), full = st.classList.contains('full');
  const cs = getComputedStyle(st), padX = parseFloat(cs.paddingLeft) + parseFloat(cs.paddingRight), padY = parseFloat(cs.paddingTop) + parseFloat(cs.paddingBottom);
  const w = st.clientWidth - padX;
  const h = full ? innerHeight - padY - 110 : innerHeight * 0.7;
  return { w: Math.max(160, Math.floor(w)), h: Math.max(160, Math.floor(h)) };
}
const kind = () => $('kQr').checked ? 'qr' : 'grid';
function fitSender() { if (sess && !$('send').hidden) player.render(); }
function syncPlayBtn() { const t = player.playing ? '暂停' : '继续播放'; $('sPlay').textContent = t; $('fsPlay').textContent = t; }
function setSFile(f) {
  sFile = f; $('sClear').hidden = !f;
  $('sFileName').textContent = f ? `${f.name}（${fmtB(f.size)}）` : '';
}
$('sFile').onchange = e => setSFile(e.target.files[0] || null);
$('sClear').onclick = e => { e.preventDefault(); setSFile(null); $('sFile').value = ''; };
$('sText').addEventListener('paste', e => {
  const it = [...(e.clipboardData?.items || [])].find(i => i.kind === 'file');
  if (!it) return;
  e.preventDefault();
  const f = it.getAsFile();
  setSFile(new File([f], f.name && f.name !== 'image.png' ? f.name : 'pasted.' + ((f.type.split('/')[1]) || 'bin'), { type: f.type }));
});
for (const el of [$('drop'), $('sText')]) {
  el.addEventListener('dragover', e => { e.preventDefault(); $('drop').classList.add('over'); });
  el.addEventListener('dragleave', () => $('drop').classList.remove('over'));
  el.addEventListener('drop', e => { e.preventDefault(); $('drop').classList.remove('over'); const f = e.dataTransfer.files[0]; if (f) setSFile(f); });
}
// 码型选项下展示这种码实际用到的颜色：彩格码 R×G×B = 2×4×2 = 16 色，二维码 RGB 三通道 = 8 色
for (const [id, gl] of [['palGrid', [0, 85, 170, 255]], ['palQr', [0, 255]]]) {
  const el = $(id);
  for (const r of [0, 255]) for (const g of gl) for (const b of [0, 255]) { const i = document.createElement('i'); i.style.background = `rgb(${r},${g},${b})`; el.appendChild(i); }
}
// 只记住两项基础设置
if (store.get('kind', 'grid') === 'qr') $('kQr').checked = true;
for (const id of ['kGrid', 'kQr']) $(id).addEventListener('change', () => store.set('kind', kind()));
$('sZ').checked = store.get('sZ', '1') === '1';
$('sZ').addEventListener('change', () => store.set('sZ', $('sZ').checked ? '1' : '0'));

function showSInfo() {
  const el = $('sInfo');
  if (!sess) { el.innerHTML = ''; return; }
  const per = sGrid ? sGrid.per : 3, secs = (sess.K + 2) / per * INTERVAL_MS / 1000;
  el.dataset.k = sess.K; el.dataset.per = per; el.dataset.ver = sGrid ? 'grid' : sess.type;
  const t = secs < 60 ? `约 ${Math.max(1, Math.ceil(secs))} 秒` : `约 ${(secs / 60).toFixed(1)} 分钟`;
  const zip = sess.meta.z ? `，压缩后 ${fmtB(sess.len)}（${sess.meta.z === 'lzma' ? 'LZMA' : 'deflate'}）` : '';
  el.innerHTML = `${fmtB(sess.meta.len)}${zip}，${t}传完。`
    + `<small>接收端收到任意 ${sess.K + 2} 块就能还原，漏掉的不用等下一轮。会话 ${sess.sid}</small>`;
}

$('sGen').onclick = async () => {
  player.stop(); syncPlayBtn();
  $('sGen').disabled = true; $('sErr').textContent = '';
  try {
    $('sGen').textContent = $('sZ').checked ? '压缩中…' : '准备中…';
    const { meta, data } = await QXS.prepareInput({ file: sFile, text: $('sText').value, compress: $('sZ').checked,
      onProgress: p => { $('sGen').textContent = `压缩中 ${Math.round(p * 100)}%`; } });
    let s, grid = null;
    if (kind() === 'grid') {
      const L = QXG.makeLayout(QXG.profile(GRID));
      s = new QXS.SenderSession(meta, data, { chunk: L.C, qr: false });
      grid = new QXG.GridFramer(s, L);
    } else s = new QXS.SenderSession(meta, data, { chunk: QR.chunk, ecc: QR.ecc });
    const per = grid ? grid.per : 3, mins = (s.K + 2) / per * INTERVAL_MS / 60000;
    if (mins > 3 && !confirm(`内容较大，至少需要约 ${mins.toFixed(1)} 分钟。继续？`)) return;
    sess = s; sGrid = grid;
    $('stageEmpty').hidden = true; $('stageBox').hidden = false;
    for (const id of ['sPlay', 'sFull']) $(id).disabled = false;
    player.load(sess, QR.rgb, grid);
    showSInfo();
    player.play(); syncPlayBtn(); keepAwake(true);
    if (innerWidth < 900) $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' });
  } catch (e) { $('sErr').textContent = e.message; }
  finally { $('sGen').disabled = false; $('sGen').textContent = '开始播放'; $('sGen').blur(); }
};
const togglePlay = () => { if (!sess) return; player.playing ? player.stop() : player.play(); syncPlayBtn(); keepAwake(player.playing); };
const step = d => { if (!sess) return; player.stop(); syncPlayBtn(); player.step(d); };
$('sPlay').onclick = togglePlay; $('fsPlay').onclick = togglePlay;
const setFull = on => { if (!sess) return; $('stage').classList.toggle('full', on); requestAnimationFrame(() => player.render()); };
$('sFull').onclick = () => setFull(true);
$('fsExit').onclick = () => setFull(false);
$('sCv').ondblclick = () => setFull(!$('stage').classList.contains('full'));
// 键盘：空格 暂停/继续 · ←/→ 逐张 · Home 从头 · F 全屏 · Esc 退出全屏（输入框里不响应）
addEventListener('keydown', e => {
  if ($('send').hidden || /^(TEXTAREA|INPUT)$/.test(document.activeElement && document.activeElement.tagName)) return;
  const full = $('stage').classList.contains('full');
  if (e.key === 'Escape' && full) setFull(false);
  else if (e.key === ' ' && sess) { e.preventDefault(); togglePlay(); }
  else if (e.key === 'ArrowRight') step(1);
  else if (e.key === 'ArrowLeft') step(-1);
  else if (e.key === 'Home' && sess) { player.stop(); syncPlayBtn(); player.restart(); }
  else if ((e.key === 'f' || e.key === 'F') && sess) setFull(!full);
});

/* ---------- 启动 ---------- */
syncScanUI();
showTab(new URLSearchParams(location.search).get('tab') || store.get('tab', 'recv'));
if ('requestIdleCallback' in window) requestIdleCallback(() => getWorkers()); else setTimeout(getWorkers, 500);
})();
</script>
</body>
</html>
